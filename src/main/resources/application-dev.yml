# The connection is the DEV deployer account (lcms_dev_deployer), which has ALL on lego_dev and
# nothing anywhere else (HOMELAB-126). Its key lives only in the owner's /dev/config/database-configuration.yml.
# It is deliberately not the key the DEV services use (rasppi5-01-lego-dev): that one is the
# application account, which has no DDL and cannot run this deployer.
spring:
  liquibase:
    parameters:
      environment-schema: lego_dev

target-database:
  datasource:
    database-key-name: rasppi5-01-lego-dev-deployer
    hikari:
      connection-timeout: 2345
      idle-timeout: 3456
      connection-test-query: SELECT 1
      initialization-fail-timeout: 10000
      auto-commit: false
      login-timeout: 10000
      minimum-idle: 5
      maximum-pool-size: 5
      validation-timeout: 300000
      pool-name: rasppi5-01-lego-dev-jdbc-pool
