# Changelog for the shared marketplace_pricing schema (HOMELAB-31). Run it with
# deployer.changelog=MARKETPLACE_PRICING (profiles marketplace-pricing and marketplace-pricing-scratch).
# The environment schemas have their own changelog: db/changelog/db.changelog-master.yaml.
databaseChangeLog:
  - includeAll:
      path: db/marketplace-pricing/files
      # Files apply in version order, so 2.10.0 follows 2.9.0 (plain text order would not).
      resourceComparator: net.lego.database.deployer.config.ChangelogFileOrder
