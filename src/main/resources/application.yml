import-path: /dev/config

spring:
  jmx:
    enabled: false
  application:
    name: Lego Database DB Deployer
  main:
    web-application-type: none
  config:
    import: optional:file:${import-path}/database-configuration.yml

logging:
  level:
    root: INFO

# mode: UPDATE (default) | CHANGELOG_SYNC | STATUS -- see DeployerMode and the README.
# changelog: ENVIRONMENT (default) | MARKETPLACE_PRICING -- see DeployerChangelog.
deployer:
  mode: UPDATE
  changelog: ENVIRONMENT
